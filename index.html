<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ZONA TV</title>

  <style>
    /* ===== RESET Y VARIABLES ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0b0b0e;
      --bg-secondary: #14141a;
      --bg-card: #1a1a24;
      --border-color: #2a2a36;
      --text-primary: #f0f0f5;
      --text-secondary: #a0a0b8;
      --accent: #f5b342;
      --accent-hover: #e6a130;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
      --radius: 12px;
      --transition: 0.25s ease;
    }

    html, body {
      height: 100%;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    /* ===== SCROLLBAR PERSONALIZADA ===== */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-secondary);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-hover);
    }

    /* ===== LAYOUT PRINCIPAL (FLEX) ===== */
    #app {
      display: flex;
      gap: 16px;
      height: 100vh;
      padding: 16px;
      background: radial-gradient(circle at 20% 30%, #181820, #0a0a0e);
      overflow: hidden;
    }

    /* ===== COLUMNA DEL REPRODUCTOR ===== */
    #player-column {
      flex: 2.2;
      min-width: 0;
      height: 100%;
      background: #000;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      position: relative;
    }

    #player {
      width: 100%;
      height: 100%;
    }

    /* ===== COLUMNA DE LA LISTA ===== */
    #playlist-column {
      flex: 1;
      min-width: 240px;
      height: 100%;
      background: var(--bg-secondary);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
    }

    /* ===== HEADER DE BÚSQUEDA ===== */
    #playlist-search {
      padding: 16px 18px;
      background: var(--bg-primary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
      align-items: center;
      flex-shrink: 0;
    }

    #searchBox {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 16px;
      outline: none;
      transition: var(--transition);
      font-family: inherit;
    }
    #searchBox:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(245, 179, 66, 0.2);
    }
    #searchBox::placeholder {
      color: var(--text-secondary);
    }

    #clearSearch {
      width: 46px;
      height: 46px;
      border: none;
      border-radius: 8px;
      background: var(--bg-card);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      flex-shrink: 0;
      border: 1px solid var(--border-color);
    }
    #clearSearch:hover {
      background: #2a2a3a;
      transform: scale(1.05);
      border-color: var(--accent);
    }
    #clearSearch svg {
      width: 28px;
      height: 28px;
      display: block;
    }

    /* ===== ÁREA DE CANALES ===== */
    #channelsScrollArea {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .channel-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 14px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
      transition: var(--transition);
      text-align: left;
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: inherit;
    }
    .channel-btn:hover {
      background: #222233;
      border-color: #444466;
      transform: translateX(4px);
    }
    .channel-btn.active {
      border-color: var(--accent);
      background: linear-gradient(135deg, #2a2400, #1f1a00);
      box-shadow: 0 0 20px rgba(245, 179, 66, 0.15);
      font-weight: 600;
    }
    .channel-btn .indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-secondary);
      flex-shrink: 0;
      transition: var(--transition);
    }
    .channel-btn.active .indicator {
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }
    .channel-btn .channel-number {
      color: var(--text-secondary);
      font-weight: 400;
      font-size: 14px;
      margin-left: auto;
      opacity: 0.6;
    }

    /* ===== FOOTER ===== */
    #playlist-footer {
      padding: 14px 18px;
      font-size: 14px;
      text-align: center;
      color: var(--text-secondary);
      border-top: 1px solid var(--border-color);
      background: var(--bg-primary);
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #playlist-footer .brand {
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    #playlist-footer .count {
      background: var(--bg-card);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      border: 1px solid var(--border-color);
    }

    /* ================================================================
       RESPONSIVE: PANTALLAS GRANDES Y LANDSCAPE EN TABLETS/MÓVILES
    ================================================================ */

    /* --- Pantallas grandes (≥1024px) y tablets en landscape (≥768px) --- */
    @media (min-width: 1024px), (min-width: 768px) and (orientation: landscape) {
      #app {
        flex-direction: row;
        gap: 16px;
        padding: 16px;
      }
      #player-column {
        flex: 2.2;
        height: 100%;
        border-radius: var(--radius);
      }
      #playlist-column {
        flex: 1;
        min-width: 260px;
        height: 100%;
        border-radius: var(--radius);
        border: 1px solid var(--border-color);
      }
    }

    /* --- Móviles en horizontal (max-width: 767px y landscape) --- */
    @media (max-width: 767px) and (orientation: landscape) {
      #app {
        flex-direction: row;
        gap: 8px;
        padding: 8px;
        height: 100vh;
      }
      #player-column {
        flex: 1.8;
        height: 100%;
        border-radius: 8px;
        min-height: 0;
      }
      #playlist-column {
        flex: 1;
        min-width: 160px;
        height: 100%;
        border-radius: 8px;
        border: 1px solid var(--border-color);
      }
      #playlist-search {
        padding: 8px 10px;
        gap: 6px;
      }
      #searchBox {
        padding: 8px 10px;
        font-size: 13px;
      }
      #clearSearch {
        width: 34px;
        height: 34px;
      }
      #clearSearch svg {
        width: 20px;
        height: 20px;
      }
      .channel-btn {
        padding: 8px 12px;
        font-size: 13px;
        gap: 8px;
        border-radius: 6px;
      }
      .channel-btn .channel-number {
        font-size: 11px;
      }
      #channelsScrollArea {
        padding: 6px 8px 8px;
        gap: 4px;
      }
      #playlist-footer {
        padding: 6px 10px;
        font-size: 11px;
        flex-wrap: wrap;
        gap: 4px;
      }
      #playlist-footer .count {
        font-size: 10px;
        padding: 2px 8px;
      }
      .channel-btn .indicator {
        width: 6px;
        height: 6px;
      }
    }

    /* --- Móviles vertical (por defecto) --- */
    @media (max-width: 820px) and (orientation: portrait) {
      #app {
        flex-direction: column;
        padding: 0;
        gap: 0;
        height: 100vh;
        background: var(--bg-primary);
      }
      #player-column {
        flex: none;
        width: 100%;
        height: 35vh;
        border-radius: 0;
        box-shadow: none;
      }
      #playlist-column {
        flex: 1;
        width: 100%;
        border-radius: 0;
        border: none;
        box-shadow: none;
        background: var(--bg-primary);
      }
      #playlist-search {
        padding: 12px 14px;
        background: var(--bg-secondary);
        border-bottom: 1px solid var(--border-color);
      }
      #channelsScrollArea {
        padding: 10px 12px 12px;
      }
      .channel-btn {
        padding: 12px 14px;
        font-size: 15px;
      }
      #playlist-footer {
        padding: 10px 14px;
        font-size: 13px;
        flex-wrap: wrap;
        gap: 6px;
      }
    }

    @media (max-width: 480px) and (orientation: portrait) {
      #player-column {
        height: 30vh;
      }
      #searchBox {
        font-size: 14px;
        padding: 10px 12px;
      }
      #clearSearch {
        width: 40px;
        height: 40px;
      }
      #clearSearch svg {
        width: 24px;
        height: 24px;
      }
    }

    /* ===== ANIMACIÓN DE CARGA ===== */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .channel-btn {
      animation: fadeInUp 0.3s ease forwards;
    }
    .channel-btn:nth-child(2) { animation-delay: 0.05s; }
    .channel-btn:nth-child(3) { animation-delay: 0.10s; }
    .channel-btn:nth-child(4) { animation-delay: 0.15s; }
    .channel-btn:nth-child(5) { animation-delay: 0.20s; }
    .channel-btn:nth-child(6) { animation-delay: 0.25s; }
    .channel-btn:nth-child(7) { animation-delay: 0.30s; }
  </style>

    /* ============================================================
       REPRODUCTOR JW
    ============================================================ */
    const player = jwplayer('player');

    function buildSource(ch) {
      return {
        file: ch.mpd,
        type: 'dash',
        drm: {
          clearkey: {
            keyId: ch.keyId,
            key: ch.key
          }
        }
      };
    }

    // Cargar el primer canal al inicio
    const firstChannel = channels[0];
    player.setup({
      playlist: [{
        title: firstChannel.title,
        sources: [buildSource(firstChannel)]
      }],
      advertising: {
        client: 'vast',
        schedule: {
          preroll: {
            offset: 'pre',
            tag: ' ' // Espacio en blanco → sin anuncio real
          }
        }
      },
      width: '100%',
      height: '100%',
      autostart: true,
      controls: true,
      mute: false,
      repeat: false
    });

    /* ============================================================
       LISTA DE CANALES Y BÚSQUEDA
    ============================================================ */
    const scrollArea = document.getElementById('channelsScrollArea');
    const searchBox = document.getElementById('searchBox');
    const clearBtn = document.getElementById('clearSearch');
    const countSpan = document.getElementById('channelCount');

    let activeIndex = 0;

    function createChannelButton(ch, index) {
      const btn = document.createElement('button');
      btn.className = 'channel-btn';
      btn.dataset.index = index;

      const dot = document.createElement('span');
      dot.className = 'indicator';
      btn.appendChild(dot);

      const nameSpan = document.createElement('span');
      nameSpan.textContent = ch.title;
      btn.appendChild(nameSpan);

      const numSpan = document.createElement('span');
      numSpan.className = 'channel-number';
      numSpan.textContent = `#${index + 1}`;
      btn.appendChild(numSpan);

      btn.addEventListener('click', () => {
        setActiveChannel(index);
        loadChannel(index);
      });

      return btn;
    }

    function renderList() {
      const query = searchBox.value.toLowerCase().trim();
      scrollArea.innerHTML = '';

      let visibleCount = 0;
      channels.forEach((ch, i) => {
        if (ch.title.toLowerCase().includes(query)) {
          const btn = createChannelButton(ch, i);
          scrollArea.appendChild(btn);
          visibleCount++;
        }
      });

      countSpan.textContent = `${visibleCount} canales`;

      if (activeIndex >= 0 && activeIndex < channels.length) {
        const allBtns = scrollArea.querySelectorAll('.channel-btn');
        allBtns.forEach(btn => {
          if (parseInt(btn.dataset.index) === activeIndex) {
            btn.classList.add('active');
          }
        });
      }
    }

    function setActiveChannel(index) {
      activeIndex = index;
      const allBtns = scrollArea.querySelectorAll('.channel-btn');
      allBtns.forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.dataset.index) === index);
      });
    }

    function loadChannel(index) {
      if (index < 0 || index >= channels.length) return;
      const ch = channels[index];
      player.load([{
        title: ch.title,
        sources: [buildSource(ch)]
      }]);
      setTimeout(() => player.play(), 300);
      setActiveChannel(index);
    }

    searchBox.addEventListener('input', renderList);
    clearBtn.addEventListener('click', () => {
      searchBox.value = '';
      renderList();
      searchBox.focus();
    });

    renderList();
    setActiveChannel(0);

    player.on('error', (e) => {
      console.warn('Error en el reproductor:', e);
    });

    console.log('✅ ZONA TV');
  </script>
